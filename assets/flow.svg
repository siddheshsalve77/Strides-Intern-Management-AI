<svg width="1200" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Workflow: Onboard, Assign, Track, Evaluate" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif;text-anchor:middle}
    .h{font-size:20px;font-weight:700;fill:#8B5CF6}
    .s{font-size:14px;fill:#8b8fa3}
    .card{fill:none;stroke:url(#line);stroke-width:2.5}
  </style>
  <path id="p" d="M150 100 H1050" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 12" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-88" dur="2s" repeatCount="indefinite"/>
  </path>
  <circle r="9" fill="#fff" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle>

  <g>
    <circle cx="150" cy="100" r="46" class="card"><animate attributeName="r" values="46;50;46" dur="3s" repeatCount="indefinite"/></circle>
    <text x="150" y="112" font-size="34" class="t">🧑‍🎓</text>
    <text x="150" y="180" class="t h">Onboard</text><text x="150" y="203" class="t s">Profiles &amp; cohorts</text>
  </g>
  <g>
    <circle cx="450" cy="100" r="46" class="card"><animate attributeName="r" values="46;50;46" dur="3s" begin="0.75s" repeatCount="indefinite"/></circle>
    <text x="450" y="112" font-size="34" class="t">📋</text>
    <text x="450" y="180" class="t h">Assign</text><text x="450" y="203" class="t s">Tasks &amp; boards</text>
  </g>
  <g>
    <circle cx="750" cy="100" r="46" class="card"><animate attributeName="r" values="46;50;46" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
    <text x="750" y="112" font-size="34" class="t">⚡</text>
    <text x="750" y="180" class="t h">Track</text><text x="750" y="203" class="t s">Real-time progress</text>
  </g>
  <g>
    <circle cx="1050" cy="100" r="46" class="card"><animate attributeName="r" values="46;50;46" dur="3s" begin="2.25s" repeatCount="indefinite"/></circle>
    <text x="1050" y="112" font-size="34" class="t">🤖</text>
    <text x="1050" y="180" class="t h">Evaluate</text><text x="1050" y="203" class="t s">AI insights &amp; reports</text>
  </g>
</svg>
