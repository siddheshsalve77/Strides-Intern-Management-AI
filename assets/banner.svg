<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Strides Intern Management AI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"><animate attributeName="stop-color" values="#4F46E5;#7C3AED;#0891B2;#4F46E5" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#06B6D4"><animate attributeName="stop-color" values="#06B6D4;#4F46E5;#7C3AED;#06B6D4" dur="12s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <!-- floating orbs -->
    <circle cx="140" cy="80" r="90" fill="#fff" opacity="0.07"><animate attributeName="cy" values="80;120;80" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="250" r="130" fill="#fff" opacity="0.06"><animate attributeName="cy" values="250;200;250" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="30" r="50" fill="#fff" opacity="0.08"><animate attributeName="cx" values="620;700;620" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="280" r="6" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="70" r="5" fill="#fff"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="140" r="4" fill="#fff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <!-- rising steps (strides) -->
    <g transform="translate(90 120)" fill="#fff">
      <rect x="0" y="80" width="30" height="40" rx="6" opacity="0.55"><animate attributeName="height" values="40;52;40" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="80;68;80" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="40" y="55" width="30" height="65" rx="6" opacity="0.75"><animate attributeName="height" values="65;77;65" dur="2.4s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="y" values="55;43;55" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></rect>
      <rect x="80" y="25" width="30" height="95" rx="6" opacity="0.95"><animate attributeName="height" values="95;107;95" dur="2.4s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="25;13;25" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></rect>
    </g>
    <!-- title -->
    <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" fill="#fff">
      <text x="260" y="150" font-size="54" font-weight="800" opacity="0">Strides Intern Management
        <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" dur="1s" begin="0.2s" fill="freeze"/>
      </text>
      <text x="260" y="215" font-size="54" font-weight="800" opacity="0">AI
        <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.6s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" dur="1s" begin="0.6s" fill="freeze"/>
      </text>
      <text x="262" y="262" font-size="20" opacity="0" letter-spacing="1.5">ONBOARD  •  ASSIGN  •  TRACK  •  EVALUATE
        <animate attributeName="opacity" from="0" to="0.92" dur="1s" begin="1.2s" fill="freeze"/>
      </text>
    </g>
    <!-- shine sweep -->
    <rect x="-300" y="0" width="300" height="320" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-400;1500" dur="5s" begin="2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
